<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>$title</title>
    <meta name="description" content="$description" />
    <link rel="canonical" href="$canonical" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="$title" />
    <meta property="og:description" content="$description" />
    <meta property="og:url" content="$canonical" />
    <meta property="og:image" content="$social_image" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/assets/fonts/abel-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/assets/site.css" />
    <script src="/assets/site.js" defer></script>
  </head>
  <body class="$body_class">
    <a class="skip-link" href="#main">Skip to photographs and content</a>
    <div class="site-shell">
      <header class="site-header">
        <a class="site-title" href="/index.html">$name</a>
        <button
          class="menu-toggle"
          aria-expanded="false"
          aria-controls="site-nav"
          hidden
        >
          Menu
        </button>
        <nav id="site-nav" class="site-nav" aria-label="Main navigation">
          $navigation
        </nav>
      </header>
      <main id="main">$content</main>
      <footer class="site-footer">
        <a
          href="https://www.instagram.com/$instagram/"
          aria-label="@$instagram on Instagram"
          target="_blank"
          rel="noopener noreferrer"
        >
          <svg
            viewBox="0 0 24 24"
            width="22"
            height="22"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <rect x="3" y="3" width="18" height="18" rx="5" />
            <circle cx="12" cy="12" r="4" />
            <circle
              cx="17.5"
              cy="6.5"
              r=".8"
              fill="currentColor"
              stroke="none"
            />
          </svg>
        </a>
      </footer>
    </div>
    <dialog class="photo-dialog" aria-label="Photograph">
      <button class="dialog-close" aria-label="Close photograph">Close</button>
      <div class="dialog-content"></div>
    </dialog>
  </body>
</html>
