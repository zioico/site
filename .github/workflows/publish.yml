name: Publish photography website

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

# Keep scheduled cache writes and human pushes in order.
concurrency:
  group: photography-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Check Instagram sync logic
        run: node --test tools/sync_instagram.test.mjs
      - name: Synchronize Instagram, if connected
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_TOKEN_KEY: ${{ secrets.INSTAGRAM_TOKEN_KEY }}
          INSTAGRAM_API_VERSION: ${{ vars.INSTAGRAM_API_VERSION || 'v25.0' }}
          INSTAGRAM_MAX_POSTS: ${{ vars.INSTAGRAM_MAX_POSTS || '80' }}
        run: node tools/sync_instagram.mjs
      - name: Build and check the public site
        run: |
          python3 tools/build.py --output dist
          python3 tools/check_site.py dist
      - name: Retain the feed and encrypted token between runs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A assets/instagram
          if test -f .private/instagram-token.json; then
            git add .private/instagram-token.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update Instagram feed [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish on GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
